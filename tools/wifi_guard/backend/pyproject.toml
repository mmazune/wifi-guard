[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "wifi-guard-api"
version = "0.3.0"
description = "Local API and offline demo discovery worker for WiFi Guard"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "psutil>=6.1,<8",
  "pydantic-settings>=2.6,<3",
  "uvicorn[standard]>=0.32,<1",
]

[project.scripts]
wifi-guard-worker = "wifi_guard_api.worker:main"

[project.optional-dependencies]
dev = [
  "httpx>=0.27,<1",
  "pytest>=8.3,<9",
]

[tool.hatch.build.targets.wheel]
packages = ["src/wifi_guard_api"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
